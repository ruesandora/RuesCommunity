<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Kırmızı Ajanlar — kendi uygulamana saldırganı sen oyna">
  <style>
    :root{ --bg:#f7f7f7; --panel:#ffffff; --ink:#0c0c0c; --line:#cfcfcf; --muted:#5c5c5c; --acc:#b8141f; --fill:#b8141f; --on:#ffffff; }
    @media (prefers-color-scheme: dark){ :root{ --bg:#0c0c0c; --panel:#141414; --ink:#f3f3f3; --line:#3a3a3a; --muted:#a2a2a2; --acc:#ff5247; --fill:#c8102e; --on:#ffffff; } }
    .bg{fill:var(--bg)} .panel{fill:var(--panel)} .ink{fill:var(--ink)} .inks{stroke:var(--ink)} .line{stroke:var(--line)} .muted{fill:var(--muted)} .acc{fill:var(--acc)} .accs{stroke:var(--acc)} .fill{fill:var(--fill)}
    .h{font-family:'Anton','Arial Narrow Bold',Impact,sans-serif;fill:var(--ink)}
    .m{font-family:ui-monospace,'JetBrains Mono',Consolas,monospace;fill:var(--muted)}
    .mi{font-family:ui-monospace,'JetBrains Mono',Consolas,monospace;fill:var(--ink)}
    .m.acc{fill:var(--acc)}
  </style>
  <rect class="bg" width="1200" height="300"/>
  <rect class="accs" x="14" y="14" width="1172" height="272" fill="none" stroke-width="4"/>
  <rect class="line" x="26" y="26" width="1148" height="248" fill="none" stroke-width="2"/>
  <!-- halftone focus lines, top-right corner -->
  <g class="accs" stroke-width="1.4" opacity="0.5">
    <line x1="1174" y1="26" x2="980" y2="26"/><line x1="1174" y1="26" x2="1174" y2="150"/>
    <line x1="1174" y1="26" x2="1020" y2="110"/><line x1="1174" y1="26" x2="1080" y2="150"/>
    <line x1="1174" y1="26" x2="1150" y2="160"/>
  </g>
  <text class="m acc" x="60" y="86" font-size="17" letter-spacing="6" font-weight="700">RUES COMMUNITY · YAPAY ZEKÂ NOTLARI #2</text>
  <text class="h" x="56" y="176" font-size="96" letter-spacing="1">KIRMIZI AJANLAR</text>
  <!-- inverted highlight chip -->
  <g>
    <rect class="fill" x="58" y="200" width="430" height="52"/>
    <text x="74" y="238" font-size="30" letter-spacing="0.5" font-family="'Anton','Arial Narrow Bold',Impact,sans-serif" fill="var(--on)">SALDIRGANI SEN OYNA</text>
  </g>
  <text class="mi" x="516" y="226" font-size="18" letter-spacing="1">kendi uygulamana — başkası bulmadan</text>
  <text class="m" x="516" y="250" font-size="14" letter-spacing="2">yalnızca yetkili kendi-sistem testi · 10 grup · 45 sınıf</text>
</svg>
