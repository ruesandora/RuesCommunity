<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Tatbikatın hattı: şef üç saldırgan ajana dağıtır (kimliğe bürünen, UI sınırlarını zorlayan, dışarıdan gelen); bulgular maskeli ve tekrarlanabilir bir kanıt defterine düşer; triyaj önem sırasına dizer; sonra ayrı bir düzeltici tur düzeltir, yeniden test eder, kaydeder.">
  <style>
    :root{ --bg:#f7f7f7; --panel:#ffffff; --ink:#0c0c0c; --line:#cfcfcf; --muted:#5c5c5c; --acc:#b8141f; --fill:#b8141f; --on:#ffffff; }
    @media (prefers-color-scheme: dark){ :root{ --bg:#0c0c0c; --panel:#141414; --ink:#f3f3f3; --line:#3a3a3a; --muted:#a2a2a2; --acc:#ff5247; --fill:#c8102e; --on:#ffffff; } }
    .bg{fill:var(--bg)} .panel{fill:var(--panel)} .ink{fill:var(--ink)}
    rect.box{fill:var(--panel);stroke:var(--ink);stroke-width:2.5}
    rect.solid{fill:var(--fill);stroke:var(--fill);stroke-width:2.5}
    rect.box.r{stroke:var(--acc)} .acc{fill:var(--acc)}
    .edge{stroke:var(--ink);stroke-width:2;fill:none}
    .dash{stroke:var(--ink);stroke-width:2;fill:none;stroke-dasharray:6 5}
    .h{font-family:'Anton','Arial Narrow Bold',Impact,sans-serif;fill:var(--ink)}
    .hp{font-family:'Anton','Arial Narrow Bold',Impact,sans-serif;fill:var(--on)}
    .m{font-family:ui-monospace,'JetBrains Mono',Consolas,monospace;fill:var(--muted)}
    .mi{font-family:ui-monospace,'JetBrains Mono',Consolas,monospace;fill:var(--ink)}
    .mp{font-family:ui-monospace,'JetBrains Mono',Consolas,monospace;fill:var(--on)}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--ink)"/></marker>
  </defs>
  <rect class="bg" width="1200" height="600"/>
  <rect x="0" y="0" width="1200" height="4" class="acc"/>
  <text class="h" x="40" y="54" font-size="30">TATBİKATIN HATTI</text>
  <text class="m" x="40" y="80" font-size="14" letter-spacing="2">saldıran ajan, düzelten ajan değildir · kanıt önce kaydedilir</text>
  <g transform="translate(0,40)">

  <!-- Şef -->
  <rect class="solid" x="40" y="214" width="190" height="96" rx="0"/>
  <text class="hp" x="135" y="256" font-size="26" text-anchor="middle">ŞEF</text>
  <text class="mp" x="135" y="282" font-size="13" text-anchor="middle">orkestrator · dağıtır</text>

  <!-- 3 attackers -->
  <g>
    <rect class="box r" x="320" y="70" width="272" height="92"/>
    <text class="h" x="340" y="104" font-size="20">SALDIRGAN A</text>
    <text class="mi" x="340" y="128" font-size="13">kimliğe bürünür · Grup 1</text>
    <text class="m" x="340" y="148" font-size="12">en güçlü model · yüksek çaba</text>

    <rect class="box r" x="320" y="216" width="272" height="92"/>
    <text class="h" x="340" y="250" font-size="20">SALDIRGAN B</text>
    <text class="mi" x="340" y="274" font-size="13">UI sınırlarını zorlar · Grup 2</text>
    <text class="m" x="340" y="294" font-size="12">en güçlü model · yüksek çaba</text>

    <rect class="box r" x="320" y="362" width="272" height="92"/>
    <text class="h" x="340" y="396" font-size="20">SALDIRGAN C</text>
    <text class="mi" x="340" y="420" font-size="13">dışarıdan gelir · Grup 3–7</text>
    <text class="m" x="340" y="440" font-size="12">orta model · gerekince yükselt</text>
  </g>

  <!-- Şef -> attackers -->
  <path class="edge" d="M230 262 H280 V116 H316" marker-end="url(#ar)"/>
  <path class="edge" d="M230 262 H316" marker-end="url(#ar)"/>
  <path class="edge" d="M230 262 H280 V408 H316" marker-end="url(#ar)"/>

  <!-- Evidence log -->
  <rect class="box" x="640" y="216" width="208" height="92"/>
  <text class="h" x="744" y="250" font-size="19" text-anchor="middle">KANIT DEFTERİ</text>
  <text class="mi" x="744" y="274" font-size="12.5" text-anchor="middle">maskeli · tekrarlanabilir</text>
  <text class="m" x="744" y="294" font-size="12" text-anchor="middle">sırlar REDACTED</text>

  <!-- attackers -> evidence -->
  <path class="edge" d="M592 116 H614 V250 H636" marker-end="url(#ar)"/>
  <path class="edge" d="M592 262 H636" marker-end="url(#ar)"/>
  <path class="edge" d="M592 408 H614 V274 H636" marker-end="url(#ar)"/>

  <!-- Triage -->
  <rect class="box" x="918" y="216" width="236" height="92"/>
  <text class="h" x="1036" y="250" font-size="20" text-anchor="middle">TRİYAJ</text>
  <text class="mi" x="1036" y="274" font-size="12.5" text-anchor="middle">önem sırası</text>
  <text class="m" x="1036" y="294" font-size="12" text-anchor="middle">kritik · yüksek · orta · düşük</text>
  <path class="edge" d="M848 262 H914" marker-end="url(#ar)"/>

  <!-- Fixer (separate pass) -->
  <rect class="box" x="640" y="430" width="514" height="96"/>
  <text class="h" x="664" y="466" font-size="20">DÜZELTİCİ · AYRI TUR</text>
  <text class="mi" x="664" y="492" font-size="13">tekrar üret → kök nedeni düzelt → yeniden test et → kaydet</text>
  <text class="m" x="664" y="512" font-size="12">saldırgan düzeltmez; her açık önce kayda geçer</text>
  <path class="dash" d="M1018 308 V392 H1030 V428" marker-end="url(#ar)"/>
  <text class="m" x="1040" y="400" font-size="12">rapordan sonra</text>
  </g>
</svg>
